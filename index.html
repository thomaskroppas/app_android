<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>Варианты почты</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #111827; --muted: #6b7280;
    --border: #e5e7eb; --accent: #2563eb; --accent-text: #fff;
    --used-bg: #f0fdf4; --used-text: #15803d; --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --card: #181b22; --text: #e5e7eb; --muted: #9ca3af;
      --border: #2a2f3a; --accent: #3b82f6; --accent-text: #fff;
      --used-bg: #13261a; --used-text: #4ade80; --danger: #f87171;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --card: #181b22; --text: #e5e7eb; --muted: #9ca3af;
    --border: #2a2f3a; --accent: #3b82f6; --accent-text: #fff;
    --used-bg: #13261a; --used-text: #4ade80; --danger: #f87171;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; gap: 12px;
  }
  header h1 { font-size: 17px; margin: 0; }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 10; background: var(--card);
  }
  button.danger { color: var(--danger); }
  .confirm { border-color: var(--danger); }
  .confirm p { margin: 0 0 12px; }
  .sync { margin: 10px 0 0; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  button {
    font: inherit; border: 1px solid var(--border); background: var(--card);
    color: var(--text); border-radius: 10px; padding: 8px 14px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; margin-bottom: 16px;
  }
  input[type=email] {
    width: 100%; font: inherit; padding: 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    margin: 8px 0 12px;
  }
  .error { color: var(--danger); font-size: 14px; min-height: 1em; }
  .muted { color: var(--muted); font-size: 14px; }
  .next-email {
    font: 600 18px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
    word-break: break-all; margin: 8px 0 14px;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .group-title { font-weight: 600; margin: 18px 0 6px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 6px; border-bottom: 1px solid var(--border);
  }
  li:last-child { border-bottom: 0; }
  li .num { color: var(--muted); font-size: 12px; min-width: 2.4em; text-align: right; }
  li .addr { flex: 1; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; word-break: break-all; }
  li.used { background: var(--used-bg); }
  li.used .addr { color: var(--used-text); text-decoration: line-through; }
  li.current { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 8px; }
  li button { padding: 4px 0; width: 34px; font-size: 15px; flex-shrink: 0; }
  .list { padding: 4px 0; }
  .more { display: block; width: 100%; margin-top: 12px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 20px;
    font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Варианты почты</h1>
  <button id="changeBtn" hidden>Поменять почту</button>
</header>

<main>
  <section id="setup" class="card" hidden>
    <label for="emailInput"><b>Введи почту</b></label>
    <input id="emailInput" type="email" placeholder="name@gmail.com" autocomplete="email" inputmode="email">
    <div class="row">
      <button id="saveBtn" class="primary">Сохранить</button>
      <button id="cancelBtn" hidden>Отмена</button>
    </div>
    <p class="error" id="error"></p>
    <p class="muted">Точки, которые уже есть в почте, убираются.</p>
  </section>

  <section id="loading" class="card">
    <p class="muted">Загружаю отметки…</p>
  </section>

  <section id="confirmBox" class="card confirm" hidden>
    <p id="confirmText"></p>
    <div class="row">
      <button id="confirmYes" class="primary"></button>
      <button id="confirmNo">Отмена</button>
    </div>
  </section>

  <section id="app" hidden>
    <div class="card">
      <div class="muted">Следующая почта <span id="nextNum"></span></div>
      <div class="next-email" id="nextEmail"></div>
      <div class="row">
        <button id="copyNextBtn" class="primary">Скопировать</button>
        <button id="useNextBtn">Отметить использованной</button>
        <button id="resetBtn" class="danger">Сбросить</button>
      </div>
      <p class="muted" id="stats"></p>
      <p class="muted sync" id="syncNote"></p>
    </div>

    <div class="card list">
      <div id="groups"></div>
      <button id="moreBtn" class="more">Показать ещё</button>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  const LOCAL_KEY = "dotEmails.v1";
  const PAGE_SIZE = 300;
  const SYNC_WAIT_MS = 10000;

  // ---------- storage ----------
  // Two backends with the same shape. On claude.ai the page gets a database
  // tied to the viewer's account, so marks follow the person across devices.
  // Anywhere else (GitHub Pages, a local file) marks stay in this browser.

  function readLocal() {
    try {
      const parsed = JSON.parse(localStorage.getItem(LOCAL_KEY) || "null");
      if (parsed && typeof parsed === "object") return { current: parsed.current || null, used: parsed.used || {} };
    } catch (e) { /* storage unavailable or corrupt */ }
    return { current: null, used: {} };
  }

  function writeLocal(data) {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); return true; }
    catch (e) { return false; }
  }

  function localStore() {
    return {
      synced: false,
      async loadCurrent() { return readLocal().current; },
      async saveCurrent(email) {
        const data = readLocal();
        if (!writeLocal({ ...data, current: email })) throw new Error("local");
      },
      watchUsed(email, onChange) {
        onChange(readLocal().used[email] || []);
        return () => {};
      },
      async saveUsed(email, list) {
        const data = readLocal();
        if (!writeLocal({ ...data, used: { ...data.used, [email]: list } })) throw new Error("local");
      },
    };
  }

  // Doc ids allow only letters, digits and _ - . ~ : @ +
  function docKey(email) {
    return encodeURIComponent(email).replace(/%/g, "~").replace(/[^A-Za-z0-9_.~:@+-]/g, "~").slice(0, 190);
  }

  // Serializes writes per document and collapses bursts into the latest value.
  function writer(ref) {
    let pending = null;
    let running = null;
    async function flush() {
      while (pending) {
        const body = pending;
        pending = null;
        await ref.set(body);
      }
    }
    return function write(body) {
      pending = body;
      if (!running) running = flush().finally(() => { running = null; });
      return running;
    };
  }

  function dbStore(db, uid) {
    const base = "data/users/" + uid;
    const stateRef = db.doc(base + "/state");
    const writeState = writer(stateRef);
    const writers = {};
    const emailRef = (email) => db.doc(base + "/" + "e_" + docKey(email));
    return {
      synced: true,
      async loadCurrent() {
        const snap = await stateRef.get();
        return snap.exists ? (snap.data().current || null) : null;
      },
      saveCurrent(email) { return writeState({ current: email }); },
      watchUsed(email, onChange, onError) {
        return emailRef(email).onSnapshot(
          (snap) => onChange(snap.exists && Array.isArray(snap.data().used) ? snap.data().used.slice() : []),
          onError
        );
      },
      saveUsed(email, list) {
        const key = docKey(email);
        if (!writers[key]) writers[key] = writer(emailRef(email));
        return writers[key]({ email: email, used: list, updatedAt: Date.now() });
      },
    };
  }

  function withTimeout(promise, ms) {
    return Promise.race([promise, new Promise((resolve) => setTimeout(() => resolve(null), ms))]);
  }

  async function openStore() {
    if (!window.claude || typeof window.claude.use !== "function") return localStore();
    try {
      const [db, user] = await withTimeout(
        Promise.all([window.claude.use("db"), window.claude.use("user")]), SYNC_WAIT_MS
      ) || [];
      const uid = user ? await user.id() : null;
      if (db && uid) return dbStore(db, uid);
    } catch (e) { /* fall back to this browser */ }
    return localStore();
  }

  // ---------- variants ----------
  function normalize(input) {
    const value = input.trim().toLowerCase();
    const at = value.lastIndexOf("@");
    if (at <= 0 || at === value.length - 1) return null;
    const local = value.slice(0, at).replace(/\./g, "");
    const domain = value.slice(at + 1);
    if (!local || /\s/.test(local + domain) || !domain.includes(".")) return null;
    return local + "@" + domain;
  }

  // Yields every dotted variant: first no dots, then all with 1 dot, 2 dots, ...
  // Inside each group the dot positions go in lexicographic order:
  // the first dot stays put while the last one moves right, then the previous one shifts.
  function* variants(email) {
    const at = email.lastIndexOf("@");
    const local = email.slice(0, at);
    const domain = email.slice(at);
    const gaps = local.length - 1; // places between letters
    let index = 0;
    for (let k = 0; k <= gaps; k++) {
      const pos = Array.from({ length: k }, (_, i) => i);
      while (true) {
        yield { index: index++, dots: k, address: build(local, pos) + domain };
        let i = k - 1;
        while (i >= 0 && pos[i] === gaps - k + i) i--;
        if (i < 0) break;
        pos[i]++;
        for (let j = i + 1; j < k; j++) pos[j] = pos[j - 1] + 1;
      }
    }
  }

  function build(local, pos) {
    let out = "";
    let p = 0;
    for (let i = 0; i < local.length; i++) {
      out += local[i];
      if (p < pos.length && pos[p] === i) { out += "."; p++; }
    }
    return out;
  }

  function totalCount(email) {
    const localLen = email.lastIndexOf("@");
    return Math.pow(2, Math.max(localLen - 1, 0));
  }

  // ---------- UI ----------
  const $ = (id) => document.getElementById(id);
  const els = {
    loading: $("loading"), setup: $("setup"), app: $("app"), changeBtn: $("changeBtn"),
    emailInput: $("emailInput"), saveBtn: $("saveBtn"), cancelBtn: $("cancelBtn"), error: $("error"),
    nextEmail: $("nextEmail"), nextNum: $("nextNum"), copyNextBtn: $("copyNextBtn"),
    useNextBtn: $("useNextBtn"), resetBtn: $("resetBtn"), stats: $("stats"), syncNote: $("syncNote"),
    groups: $("groups"), moreBtn: $("moreBtn"), toast: $("toast"),
    confirmBox: $("confirmBox"), confirmText: $("confirmText"), confirmYes: $("confirmYes"), confirmNo: $("confirmNo"),
  };

  let store = null;
  let current = null;
  let used = [];
  let stopWatching = () => {};
  let iterator = null;
  let rendered = 0;
  let lastGroup = -1;
  let currentList = null;
  let nextVariant = null;

  function isUsed(address) {
    return used.includes(address);
  }

  function persistUsed() {
    store.saveUsed(current, used).catch(() => showToast("Не удалось сохранить отметку, проверь соединение"));
  }

  function setUsed(address, value) {
    const rest = used.filter((a) => a !== address);
    used = value ? rest.concat(address) : rest;
    markItem(address, value);
    refreshNext();
    persistUsed();
  }

  function findNext() {
    for (const v of variants(current)) {
      if (!isUsed(v.address)) return v;
    }
    return null;
  }

  function showSetup() {
    hideConfirm();
    els.loading.hidden = true;
    els.setup.hidden = false;
    els.app.hidden = true;
    els.changeBtn.hidden = true;
    els.cancelBtn.hidden = !current;
    els.emailInput.value = "";
    els.error.textContent = "";
    els.emailInput.focus();
  }

  function showApp() {
    hideConfirm();
    els.loading.hidden = true;
    els.setup.hidden = true;
    els.app.hidden = false;
    els.changeBtn.hidden = false;
    els.syncNote.textContent = store.synced
      ? "Отметки синхронизируются между устройствами, где ты вошёл в claude.ai."
      : "Отметки хранятся только в этом браузере.";
    renderList();
  }

  function watchCurrent() {
    stopWatching();
    stopWatching = store.watchUsed(current, applyUsed, () => showToast("Синхронизация прервалась, обнови страницу"));
  }

  // Repaints marks in place so the expanded list keeps its length.
  function applyUsed(list) {
    used = list;
    els.groups.querySelectorAll("li").forEach((li) => paintItem(li, isUsed(li.dataset.address)));
    refreshNext();
  }

  function renderList() {
    iterator = variants(current);
    rendered = 0;
    lastGroup = -1;
    currentList = null;
    els.groups.textContent = "";
    renderMore();
    refreshNext();
  }

  function refreshNext() {
    nextVariant = findNext();
    const total = totalCount(current);
    if (nextVariant) {
      els.nextEmail.textContent = nextVariant.address;
      els.nextNum.textContent = "(№" + (nextVariant.index + 1) + ")";
    } else {
      els.nextEmail.textContent = "Все варианты использованы";
      els.nextNum.textContent = "";
    }
    els.copyNextBtn.disabled = !nextVariant;
    els.useNextBtn.disabled = !nextVariant;
    els.resetBtn.disabled = used.length === 0;
    els.stats.textContent = "Использовано " + used.length + " из " + total.toLocaleString("ru-RU");
    document.querySelectorAll("li.current").forEach((li) => li.classList.remove("current"));
    if (nextVariant) {
      const li = document.querySelector('li[data-index="' + nextVariant.index + '"]');
      if (li) li.classList.add("current");
    }
  }

  function dotsLabel(k) {
    if (k === 0) return "Без точек";
    const mod10 = k % 10, mod100 = k % 100;
    const word = mod10 === 1 && mod100 !== 11 ? "точка"
      : mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14) ? "точки" : "точек";
    return k + " " + word;
  }

  function renderMore() {
    const frag = document.createDocumentFragment();
    let count = 0;
    let done = false;
    while (count < PAGE_SIZE) {
      const step = iterator.next();
      if (step.done) { done = true; break; }
      const v = step.value;
      if (v.dots !== lastGroup) {
        lastGroup = v.dots;
        const title = document.createElement("div");
        title.className = "group-title";
        title.textContent = dotsLabel(v.dots);
        currentList = document.createElement("ul");
        frag.appendChild(title);
        frag.appendChild(currentList);
      }
      currentList.appendChild(renderItem(v));
      count++;
    }
    els.groups.appendChild(frag);
    rendered += count;
    els.moreBtn.hidden = done || rendered >= totalCount(current);
  }

  function renderItem(v) {
    const li = document.createElement("li");
    li.dataset.index = v.index;
    li.dataset.address = v.address;

    const num = document.createElement("span");
    num.className = "num";
    num.textContent = v.index + 1;

    const addr = document.createElement("span");
    addr.className = "addr";
    addr.textContent = v.address;

    const copy = document.createElement("button");
    copy.textContent = "⧉";
    copy.title = "Скопировать";
    copy.setAttribute("aria-label", "Скопировать");
    copy.dataset.action = "copy";

    const toggle = document.createElement("button");
    toggle.dataset.action = "toggle";

    li.append(num, addr, copy, toggle);
    paintItem(li, isUsed(v.address));
    return li;
  }

  function paintItem(li, value) {
    li.classList.toggle("used", value);
    const toggle = li.querySelector('[data-action="toggle"]');
    toggle.textContent = value ? "↺" : "✓";
    toggle.title = value ? "Вернуть" : "Отметить использованной";
    toggle.setAttribute("aria-label", toggle.title);
  }

  function markItem(address, value) {
    const li = document.querySelector('li[data-address="' + CSS.escape(address) + '"]');
    if (li) paintItem(li, value);
  }

  // The artifact viewer blocks confirm(), so confirmations live in the page.
  let confirmAction = null;
  function askConfirm(text, yesLabel, action) {
    confirmAction = action;
    els.confirmText.textContent = text;
    els.confirmYes.textContent = yesLabel;
    els.confirmBox.hidden = false;
    els.confirmBox.scrollIntoView({ block: "nearest" });
    els.confirmNo.focus();
  }
  function hideConfirm() {
    confirmAction = null;
    els.confirmBox.hidden = true;
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
      ta.remove();
      if (!ok) { showToast("Не удалось скопировать, выдели адрес вручную"); return; }
    }
    showToast("Скопировано: " + text);
  }

  let toastTimer = null;
  function showToast(text) {
    els.toast.textContent = text;
    els.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove("show"), 1800);
  }

  // ---------- events ----------
  els.saveBtn.addEventListener("click", async () => {
    const email = normalize(els.emailInput.value);
    if (!email) { els.error.textContent = "Похоже, это не почта. Пример: name@gmail.com"; return; }
    els.saveBtn.disabled = true;
    try {
      await store.saveCurrent(email);
    } catch (e) {
      showToast("Не удалось сохранить почту, проверь соединение");
    } finally {
      els.saveBtn.disabled = false;
    }
    current = email;
    used = [];
    showApp();
    watchCurrent();
  });

  els.emailInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") els.saveBtn.click();
  });

  els.cancelBtn.addEventListener("click", showApp);

  els.changeBtn.addEventListener("click", () => {
    askConfirm("Поменять почту? Отметки для текущей почты сохранятся.", "Поменять", showSetup);
  });

  els.resetBtn.addEventListener("click", () => {
    askConfirm("Сбросить все отметки (" + used.length + ") для этой почты?", "Сбросить", () => {
      hideConfirm();
      applyUsed([]);
      persistUsed();
      showToast("Отметки сброшены");
    });
  });

  els.confirmYes.addEventListener("click", () => { if (confirmAction) confirmAction(); });
  els.confirmNo.addEventListener("click", hideConfirm);

  els.copyNextBtn.addEventListener("click", () => {
    if (nextVariant) copyText(nextVariant.address);
  });

  els.useNextBtn.addEventListener("click", () => {
    if (nextVariant) setUsed(nextVariant.address, true);
  });

  els.moreBtn.addEventListener("click", () => { renderMore(); refreshNext(); });

  els.groups.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const address = btn.closest("li").dataset.address;
    if (btn.dataset.action === "copy") copyText(address);
    else setUsed(address, !isUsed(address));
  });

  // ---------- start ----------
  (async function start() {
    store = await openStore();
    try { current = await store.loadCurrent(); } catch (e) { current = null; }
    if (!current) { showSetup(); return; }
    showApp();
    watchCurrent();
  })();
})();
</script>
</body>
</html>
