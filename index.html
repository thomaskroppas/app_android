<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>Варианты почты</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Почта">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #111827; --muted: #6b7280;
    --border: #e5e7eb; --accent: #2563eb; --accent-text: #fff;
    --used-bg: #f0fdf4; --used-text: #15803d; --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --card: #181b22; --text: #e5e7eb; --muted: #9ca3af;
      --border: #2a2f3a; --accent: #3b82f6; --accent-text: #fff;
      --used-bg: #13261a; --used-text: #4ade80; --danger: #f87171;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --card: #181b22; --text: #e5e7eb; --muted: #9ca3af;
    --border: #2a2f3a; --accent: #3b82f6; --accent-text: #fff;
    --used-bg: #13261a; --used-text: #4ade80; --danger: #f87171;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; gap: 12px;
  }
  header h1 { font-size: 17px; margin: 0; }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 10; background: var(--card);
  }
  button.danger { color: var(--danger); }
  .confirm { border-color: var(--danger); }
  .confirm p { margin: 0 0 12px; }
  .sync { margin: 10px 0 0; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  button {
    font: inherit; border: 1px solid var(--border); background: var(--card);
    color: var(--text); border-radius: 10px; padding: 8px 14px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; margin-bottom: 16px;
  }
  input[type=email] {
    width: 100%; font: inherit; padding: 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    margin: 8px 0 12px;
  }
  .error { color: var(--danger); font-size: 14px; min-height: 1em; }
  .muted { color: var(--muted); font-size: 14px; }
  .next-email {
    font: 600 18px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
    word-break: break-all; margin: 8px 0 14px;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .group-title { font-weight: 600; margin: 18px 0 6px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 6px; border-bottom: 1px solid var(--border);
  }
  li:last-child { border-bottom: 0; }
  li .num { color: var(--muted); font-size: 12px; min-width: 2.4em; text-align: right; }
  li .addr { flex: 1; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; word-break: break-all; }
  li.used { background: var(--used-bg); }
  li.used .addr { color: var(--used-text); text-decoration: line-through; }
  li.current { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 8px; }
  li .date { color: var(--used-text); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .last { font-weight: 600; color: var(--text); }
  li button { padding: 4px 0; width: 34px; font-size: 15px; flex-shrink: 0; }
  .list { padding: 4px 0; }
  .more { display: block; width: 100%; margin-top: 12px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 20px;
    font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Варианты почты</h1>
  <button id="changeBtn" hidden>Поменять почту</button>
</header>

<main>
  <section id="setup" class="card" hidden>
    <label for="emailInput"><b>Введи почту</b></label>
    <input id="emailInput" type="email" placeholder="name@gmail.com" autocomplete="email" inputmode="email">
    <div class="row">
      <button id="saveBtn" class="primary">Сохранить</button>
      <button id="cancelBtn" hidden>Отмена</button>
    </div>
    <p class="error" id="error"></p>
    <p class="muted">Точки, которые уже есть в почте, убираются.</p>
  </section>

  <section id="loading" class="card" hidden>
    <p class="muted">Загружаю отметки…</p>
  </section>

  <section id="confirmBox" class="card confirm" hidden>
    <p id="confirmText"></p>
    <div class="row">
      <button id="confirmYes" class="primary"></button>
      <button id="confirmNo">Отмена</button>
    </div>
  </section>

  <section id="app" hidden>
    <div class="card">
      <div class="muted">Следующая почта <span id="nextNum"></span></div>
      <div class="next-email" id="nextEmail"></div>
      <div class="row">
        <button id="copyNextBtn" class="primary">Скопировать</button>
        <button id="useNextBtn">Отметить использованной</button>
        <button id="resetBtn" class="danger">Сбросить</button>
      </div>
      <p class="muted"><span class="last" id="lastUsed"></span></p>
      <p class="muted" id="stats"></p>
    </div>

    <div class="card list">
      <div id="groups"></div>
      <button id="moreBtn" class="more">Показать ещё</button>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  // Firebase Realtime Database of the "mail-randomizer-github" project.
  // Marks live at emails/<email key>/used/<variant number> = timestamp (ms).
  const DB_NAME = "mail-randomizer-github-default-rtdb";
  const DB_CANDIDATES = [
    "https://" + DB_NAME + ".firebaseio.com",
    "https://" + DB_NAME + ".europe-west1.firebasedatabase.app",
    "https://" + DB_NAME + ".asia-southeast1.firebasedatabase.app",
  ];
  const LOCAL_KEY = "dotEmails.v2";
  const PAGE_SIZE = 300;
  const DAY_MS = 24 * 60 * 60 * 1000;

  // ---------- this device: which email is open, which db url works ----------
  function readLocal() {
    try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}") || {}; }
    catch (e) { return {}; }
  }
  function writeLocal(patch) {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ ...readLocal(), ...patch })); }
    catch (e) { /* private mode: the page still works, it just asks for the email again */ }
  }

  // ---------- Firebase REST ----------
  let dbUrl = null;

  async function probe(base) {
    const res = await fetch(base + "/emails.json?shallow=true");
    if (res.ok) return base;
    const text = await res.text();
    // A database in another region answers with its real address in the error.
    const hint = text.match(/https:\/\/[a-z0-9.-]+\.(?:firebaseio\.com|firebasedatabase\.app)/i);
    if (hint && hint[0] !== base) {
      const other = await fetch(hint[0] + "/emails.json?shallow=true");
      if (other.ok) return hint[0];
    }
    throw new Error(res.status + " " + text.slice(0, 200));
  }

  async function resolveDb() {
    const cached = readLocal().dbUrl;
    const list = cached ? [cached].concat(DB_CANDIDATES.filter((u) => u !== cached)) : DB_CANDIDATES;
    let lastError = null;
    for (const base of list) {
      try {
        const url = await probe(base);
        writeLocal({ dbUrl: url });
        return url;
      } catch (e) { lastError = e; }
    }
    throw lastError || new Error("no database");
  }

  // Firebase keys may not contain . $ # [ ] /
  function emailKey(email) {
    return encodeURIComponent(email).replace(/\./g, ",").replace(/[$#\[\]\/]/g, "_");
  }

  function usedUrl(email, index) {
    return dbUrl + "/emails/" + emailKey(email) + "/used" + (index === undefined ? "" : "/" + index) + ".json";
  }

  async function request(url, method, body) {
    const res = await fetch(url, {
      method: method,
      headers: body === undefined ? {} : { "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    if (!res.ok) throw new Error(res.status + " " + (await res.text()).slice(0, 200));
    return res.json();
  }

  // Live stream of emails/<key>/used. Firebase sends "put" and "patch" events.
  function watchUsed(email, onChange, onError) {
    const source = new EventSource(usedUrl(email));
    let data = {};
    function apply(kind, payload) {
      const path = payload.path.replace(/^\//, "");
      if (kind === "put" && path === "") data = { ...(payload.data || {}) };
      else if (kind === "put") {
        const next = { ...data };
        if (payload.data === null) delete next[path]; else next[path] = payload.data;
        data = next;
      } else if (kind === "patch") {
        const next = { ...data };
        Object.entries(payload.data || {}).forEach(([k, v]) => { if (v === null) delete next[k]; else next[k] = v; });
        data = next;
      }
      onChange(data);
    }
    source.addEventListener("put", (e) => apply("put", JSON.parse(e.data)));
    source.addEventListener("patch", (e) => apply("patch", JSON.parse(e.data)));
    source.addEventListener("cancel", () => onError("Доступ к базе запрещён, проверь правила Firebase"));
    source.addEventListener("auth_revoked", () => onError("Доступ к базе запрещён, проверь правила Firebase"));
    source.onerror = () => { if (source.readyState === EventSource.CLOSED) onError("Связь с базой потеряна, обнови страницу"); };
    return () => source.close();
  }

  // ---------- variants ----------
  function normalize(input) {
    const value = input.trim().toLowerCase();
    const at = value.lastIndexOf("@");
    if (at <= 0 || at === value.length - 1) return null;
    const local = value.slice(0, at).replace(/\./g, "");
    const domain = value.slice(at + 1);
    if (!local || /\s/.test(local + domain) || !domain.includes(".")) return null;
    return local + "@" + domain;
  }

  // Yields every dotted variant: first no dots, then all with 1 dot, 2 dots, ...
  // Inside each group the dot positions go in lexicographic order:
  // the first dot stays put while the last one moves right, then the previous one shifts.
  function* variants(email) {
    const at = email.lastIndexOf("@");
    const local = email.slice(0, at);
    const domain = email.slice(at);
    const gaps = local.length - 1; // places between letters
    let index = 0;
    for (let k = 0; k <= gaps; k++) {
      const pos = Array.from({ length: k }, (_, i) => i);
      while (true) {
        yield { index: index++, dots: k, address: build(local, pos) + domain };
        let i = k - 1;
        while (i >= 0 && pos[i] === gaps - k + i) i--;
        if (i < 0) break;
        pos[i]++;
        for (let j = i + 1; j < k; j++) pos[j] = pos[j - 1] + 1;
      }
    }
  }

  function build(local, pos) {
    let out = "";
    let p = 0;
    for (let i = 0; i < local.length; i++) {
      out += local[i];
      if (p < pos.length && pos[p] === i) { out += "."; p++; }
    }
    return out;
  }

  function totalCount(email) {
    const localLen = email.lastIndexOf("@");
    return Math.pow(2, Math.max(localLen - 1, 0));
  }

  // ---------- dates ----------
  function formatDate(ts, short) {
    return new Date(ts).toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: short ? "2-digit" : "numeric" });
  }

  function daysAgo(ts) {
    const start = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    const days = Math.round((start(new Date()) - start(new Date(ts))) / DAY_MS);
    if (days <= 0) return "сегодня";
    if (days === 1) return "вчера";
    const mod10 = days % 10, mod100 = days % 100;
    const word = mod10 === 1 && mod100 !== 11 ? "день"
      : mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14) ? "дня" : "дней";
    return days + " " + word + " назад";
  }

  // ---------- UI ----------
  const $ = (id) => document.getElementById(id);
  const els = {
    loading: $("loading"), setup: $("setup"), app: $("app"), changeBtn: $("changeBtn"),
    emailInput: $("emailInput"), saveBtn: $("saveBtn"), cancelBtn: $("cancelBtn"), error: $("error"),
    nextEmail: $("nextEmail"), nextNum: $("nextNum"), copyNextBtn: $("copyNextBtn"),
    useNextBtn: $("useNextBtn"), resetBtn: $("resetBtn"), stats: $("stats"), lastUsed: $("lastUsed"),
    groups: $("groups"), moreBtn: $("moreBtn"), toast: $("toast"),
    confirmBox: $("confirmBox"), confirmText: $("confirmText"), confirmYes: $("confirmYes"), confirmNo: $("confirmNo"),
  };

  let current = null;
  let used = {}; // variant index -> timestamp when it was marked
  let stopWatching = () => {};
  let iterator = null;
  let rendered = 0;
  let lastGroup = -1;
  let currentList = null;
  let nextVariant = null;

  function usedAt(index) {
    return used[index] || null;
  }

  async function setUsed(index, value) {
    const before = used;
    const next = { ...used };
    if (value) next[index] = Date.now(); else delete next[index];
    applyUsed(next);
    try {
      await request(usedUrl(current, index), value ? "PUT" : "DELETE", value ? next[index] : undefined);
    } catch (e) {
      applyUsed(before);
      showToast("Не удалось сохранить отметку, проверь интернет");
    }
  }

  function findNext() {
    for (const v of variants(current)) {
      if (!usedAt(v.index)) return v;
    }
    return null;
  }

  function showLoading(text) {
    els.loading.querySelector("p").textContent = text;
    els.loading.hidden = false;
    els.setup.hidden = true;
    els.app.hidden = true;
  }

  function showSetup() {
    hideConfirm();
    els.loading.hidden = true;
    els.setup.hidden = false;
    els.app.hidden = true;
    els.changeBtn.hidden = true;
    els.cancelBtn.hidden = !current;
    els.emailInput.value = "";
    els.error.textContent = "";
    els.emailInput.focus();
  }

  function openEmail(email) {
    hideConfirm();
    current = email;
    used = {};
    els.loading.hidden = true;
    els.setup.hidden = true;
    els.app.hidden = false;
    els.changeBtn.hidden = false;
    renderList();
    stopWatching();
    stopWatching = watchUsed(email, applyUsed, showToast);
  }

  // Repaints marks in place so the expanded list keeps its length.
  function applyUsed(map) {
    used = map;
    els.groups.querySelectorAll("li").forEach((li) => paintItem(li, usedAt(li.dataset.index)));
    refreshNext();
  }

  function renderList() {
    iterator = variants(current);
    rendered = 0;
    lastGroup = -1;
    currentList = null;
    els.groups.textContent = "";
    renderMore();
    refreshNext();
  }

  function refreshNext() {
    nextVariant = findNext();
    const stamps = Object.values(used);
    const total = totalCount(current);
    if (nextVariant) {
      els.nextEmail.textContent = nextVariant.address;
      els.nextNum.textContent = "(№" + (nextVariant.index + 1) + ")";
    } else {
      els.nextEmail.textContent = "Все варианты использованы";
      els.nextNum.textContent = "";
    }
    els.copyNextBtn.disabled = !nextVariant;
    els.useNextBtn.disabled = !nextVariant;
    els.resetBtn.disabled = stamps.length === 0;
    const last = stamps.length ? Math.max.apply(null, stamps) : null;
    els.lastUsed.textContent = last
      ? "Последняя регистрация: " + formatDate(last) + " (" + daysAgo(last) + ")"
      : "Регистраций ещё не было";
    els.stats.textContent = "Использовано " + stamps.length + " из " + total.toLocaleString("ru-RU");
    document.querySelectorAll("li.current").forEach((li) => li.classList.remove("current"));
    if (nextVariant) {
      const li = document.querySelector('li[data-index="' + nextVariant.index + '"]');
      if (li) li.classList.add("current");
    }
  }

  function dotsLabel(k) {
    if (k === 0) return "Без точек";
    const mod10 = k % 10, mod100 = k % 100;
    const word = mod10 === 1 && mod100 !== 11 ? "точка"
      : mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14) ? "точки" : "точек";
    return k + " " + word;
  }

  function renderMore() {
    const frag = document.createDocumentFragment();
    let count = 0;
    let done = false;
    while (count < PAGE_SIZE) {
      const step = iterator.next();
      if (step.done) { done = true; break; }
      const v = step.value;
      if (v.dots !== lastGroup) {
        lastGroup = v.dots;
        const title = document.createElement("div");
        title.className = "group-title";
        title.textContent = dotsLabel(v.dots);
        currentList = document.createElement("ul");
        frag.appendChild(title);
        frag.appendChild(currentList);
      }
      currentList.appendChild(renderItem(v));
      count++;
    }
    els.groups.appendChild(frag);
    rendered += count;
    els.moreBtn.hidden = done || rendered >= totalCount(current);
  }

  function renderItem(v) {
    const li = document.createElement("li");
    li.dataset.index = v.index;
    li.dataset.address = v.address;

    const num = document.createElement("span");
    num.className = "num";
    num.textContent = v.index + 1;

    const addr = document.createElement("span");
    addr.className = "addr";
    addr.textContent = v.address;

    const date = document.createElement("span");
    date.className = "date";

    const copy = document.createElement("button");
    copy.textContent = "⧉";
    copy.title = "Скопировать";
    copy.setAttribute("aria-label", "Скопировать");
    copy.dataset.action = "copy";

    const toggle = document.createElement("button");
    toggle.dataset.action = "toggle";

    li.append(num, addr, date, copy, toggle);
    paintItem(li, usedAt(v.index));
    return li;
  }

  function paintItem(li, ts) {
    li.classList.toggle("used", !!ts);
    li.querySelector(".date").textContent = ts ? formatDate(ts, true) : "";
    const toggle = li.querySelector('[data-action="toggle"]');
    toggle.textContent = ts ? "↺" : "✓";
    toggle.title = ts ? "Вернуть" : "Отметить использованной";
    toggle.setAttribute("aria-label", toggle.title);
  }

  let confirmAction = null;
  function askConfirm(text, yesLabel, action) {
    confirmAction = action;
    els.confirmText.textContent = text;
    els.confirmYes.textContent = yesLabel;
    els.confirmBox.hidden = false;
    els.confirmBox.scrollIntoView({ block: "nearest" });
    els.confirmNo.focus();
  }
  function hideConfirm() {
    confirmAction = null;
    els.confirmBox.hidden = true;
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
      ta.remove();
      if (!ok) { showToast("Не удалось скопировать, выдели адрес вручную"); return; }
    }
    showToast("Скопировано: " + text);
  }

  let toastTimer = null;
  function showToast(text) {
    els.toast.textContent = text;
    els.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove("show"), 2200);
  }

  // ---------- events ----------
  els.saveBtn.addEventListener("click", () => {
    const email = normalize(els.emailInput.value);
    if (!email) { els.error.textContent = "Похоже, это не почта. Пример: name@gmail.com"; return; }
    writeLocal({ current: email });
    openEmail(email);
  });

  els.emailInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") els.saveBtn.click();
  });

  els.cancelBtn.addEventListener("click", () => openEmail(current));

  els.changeBtn.addEventListener("click", () => {
    askConfirm("Поменять почту? Отметки для текущей почты сохранятся.", "Поменять", showSetup);
  });

  els.resetBtn.addEventListener("click", () => {
    const count = Object.keys(used).length;
    askConfirm("Сбросить все отметки (" + count + ") для этой почты?", "Сбросить", async () => {
      hideConfirm();
      const before = used;
      applyUsed({});
      try {
        await request(usedUrl(current), "DELETE");
        showToast("Отметки сброшены");
      } catch (e) {
        applyUsed(before);
        showToast("Не удалось сбросить, проверь интернет");
      }
    });
  });

  els.confirmYes.addEventListener("click", () => { if (confirmAction) confirmAction(); });
  els.confirmNo.addEventListener("click", hideConfirm);

  els.copyNextBtn.addEventListener("click", () => {
    if (nextVariant) copyText(nextVariant.address);
  });

  els.useNextBtn.addEventListener("click", () => {
    if (nextVariant) setUsed(nextVariant.index, true);
  });

  els.moreBtn.addEventListener("click", () => { renderMore(); refreshNext(); });

  els.groups.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const li = btn.closest("li");
    if (btn.dataset.action === "copy") copyText(li.dataset.address);
    else setUsed(Number(li.dataset.index), !usedAt(li.dataset.index));
  });

  // ---------- start ----------
  (async function start() {
    showLoading("Подключаюсь к базе…");
    try {
      dbUrl = await resolveDb();
    } catch (e) {
      showLoading("Не получилось подключиться к базе Firebase. Проверь интернет и правила базы (раздел Rules), потом обнови страницу.");
      return;
    }
    const saved = readLocal().current;
    if (saved) openEmail(saved); else showSetup();
  })();
})();
</script>
</body>
</html>
